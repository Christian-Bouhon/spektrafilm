name: Build Spektrafilm AppImage

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write
  actions: write

jobs:
  AppImage:
    if: github.repository == 'Christian-Bouhon/spektrafilm' || github.repository == 'andreavolpato/spektrafilm' || github.event_name == 'workflow_dispatch'
    name: Spektrafilm AppImage
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # Installation des dépendances système requises par appimagetool ET libxcb-cursor0 pour Qt6
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 file wget libxcb-cursor0

      - name: Build AppImage
        run: |
          chmod +x build-appimage.sh
          ./build-appimage.sh

      - name: Package upload
        uses: actions/upload-artifact@v4
        with:
          path: Spektrafilm-x86_64.AppImage
          name: artifact-appimage-x86_64
          retention-days: 1
          if-no-files-found: error

  upload_to_release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs: [AppImage]
    if: github.repository == 'Christian-Bouhon/spektrafilm' || github.repository == 'andreavolpato/spektrafilm' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout main to update 'Main' tag
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Force move 'Main' tag
        run: |
          git tag -d Main || true
          git push origin --delete Main || true
          git tag Main
          git push origin Main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: artifact-appimage-x86_64
          path: downloaded-artifacts

      - name: Get current date
        run: |
          NOW=$(date +'%Y%m%d')
          echo "RELEASE_DATE=$NOW" >> $GITHUB_ENV
        shell: bash

      - name: Create/Update GitHub release
        uses: ncipollo/release-action@v1.21.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          allowUpdates: true
          removeArtifacts: true
          tag: Main
          prerelease: true
          name: 'Spektrafilm AppImage "experimental build" ${{ env.RELEASE_DATE }}'
          body: |
            Automated AppImage build for Spektrafilm.
            
            This package contains a standalone version of Spektrafilm with Python and all dependencies bundled.
          artifacts: 'downloaded-artifacts/*.AppImage'